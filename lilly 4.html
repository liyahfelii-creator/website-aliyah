      <form id="myform">

    <p class="word">leave me a word</p>

    <button type="button" onclick="chooseReaction('Like 👍')">
        👍 Like
    </button>

    <button type="button" onclick="chooseReaction('Dislike 👎')">
        👎 Dislike
    </button>

    <p id="reactionText"></p>

    <input type="hidden" name="reaction" id="reaction">

    <br>

    <button type="submit">Kirim</button>

</form>

<script>
const form = document.getElementById("myform");

const url = "https://script.google.com/macros/s/AKfycbwEOhyoV75urBKFTM22Tn4H3Bgr78fo9HUll7p8ZqAxkug62g8UonLkgOTrRozy0KRs/exec";

function chooseReaction(reaction) {
    document.getElementById("reaction").value = reaction;
    document.getElementById("reactionText").innerText =
        "Kamu memilih: " + reaction;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const data = new FormData(form);

    fetch(url, {
        method: "POST",
        body: data,
        mode: "no-cors"
    });

    alert("Pesan berhasil dikirim! 💌");
    form.reset();
    document.getElementById("reactionText").innerText = "";
});
</script>

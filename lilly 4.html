      <form id="myform">

    <p class="word">leave me a word</p>
    <div class="leke"
    <p>Nama</p>
    <input type="text" name="nama" required>

    <p>Email</p>
    <input type="email" name="email" required>

    <p>Message</p>
    <textarea name="message"></textarea>

    <br><br>

    <p>How do you like my website?</p>

    <button type="button" onclick="chooseReaction('Like 👍')">
        👍 Like
    </button>

    <button type="button" onclick="chooseReaction('Dislike 👎')">
        👎 Dislike
    </button>

    <p id="reactionText"></p>

    <input type="hidden" name="reaction" id="reaction">

    <br>

    <button type="submit">Kirim</button>
</div>
</form>

<script>
const form = document.getElementById("myform");

const url = "https://script.google.com/macros/s/AKfycbwEOhyoV75urBKFTM22Tn4H3Bgr78fo9HUll7p8ZqAxkug62g8UonLkgOTrRozy0KRs/exec";
const supabaseUrl = "https://wpjvkuaxockmuyccgqu.supabase.co";
const supabaseKey = "sb_publishable_bzernbtU4yV_xWswaXeU7A_EL2tl79U";

let selectedReaction = "";

function chooseReaction(reaction) {
    selectedReaction = reaction;
    document.getElementById("reaction").value = reaction;
    document.getElementById("reactionText").innerText =
        "Kamu memilih: " + reaction;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = new FormData(form);

    // GOOGLE SHEETS
    fetch(url, {
        method: "POST",
        body: data,
        mode: "no-cors"
    });

    // SUPABASE
    const response = await fetch(
        supabaseUrl + "/rest/v1/like",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": supabaseKey,
                "Authorization": "Bearer " + supabaseKey
            },
            body: JSON.stringify({
                name: document.querySelector('[name="name"]').value,
                email: document.querySelector('[name="email"]').value,
                message: document.querySelector('[name="message"]').value,
                reaction: selectedReaction
            })
        }
    );

    if (response.ok) {
        alert("Pesan berhasil dikirim! ❤️");
        form.reset();
        selectedReaction = "";
        document.getElementById("reactionText").innerText = "";
    } else {
        console.log(await response.text());
        alert("Gagal menyimpan ke database 😭");
    }
});
</script>
